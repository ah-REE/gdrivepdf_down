<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      margin: 0;
      width: 300px;
      background: #f4f1ea;
      color: #121212;
      font: 13px 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
      padding: 16px;
    }
    h1 {
      font-size: 12px;
      margin: 0 0 6px;
      font-weight: 700;
      letter-spacing: 0.1em;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    h1 .dot {
      width: 13px;
      height: 13px;
      background: #ff2d20;
      border: 2px solid #121212;
      flex: none;
    }
    p { color: #6b665c; font-size: 11.5px; margin: 0 0 12px; line-height: 1.55; }
    input {
      width: 100%;
      box-sizing: border-box;
      background: #fffefb;
      border: 2px solid #121212;
      color: #121212;
      padding: 9px 10px;
      font: 12px 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
    }
    input:focus { outline: none; border-color: #ff2d20; }
    button {
      margin-top: 8px;
      width: 100%;
      background: #121212;
      color: #f4f1ea;
      border: 2px solid #121212;
      padding: 10px;
      font: 700 11.5px 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
    }
    button:hover:not(:disabled) { background: #ff2d20; border-color: #ff2d20; }
    button.secondary {
      background: transparent;
      color: #121212;
      margin-top: 0;
    }
    button.secondary:hover:not(:disabled) { background: #121212; color: #f4f1ea; border-color: #121212; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    #msg { color: #6b665c; font-size: 11px; margin-top: 10px; min-height: 14px; letter-spacing: 0.04em; }
    .hr { height: 2px; background: #121212; margin: 12px 0; }
  </style>
</head>
<body>
  <h1><span class="dot"></span>GDRIVE_DOWN</h1>
  <p>Capture a view-only Drive file to PDF. Runs locally in your browser.</p>
  <button id="tabBtn" class="secondary">Capture the current Drive tab</button>
  <div class="hr"></div>
  <input id="link" placeholder="or paste a Drive link…" />
  <button id="goBtn">Capture link</button>
  <div id="msg"></div>
  <script src="popup.js"></script>
</body>
</html>
