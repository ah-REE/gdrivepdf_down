<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      margin: 0;
      width: 300px;
      background: #05070d;
      background-image: radial-gradient(rgba(140, 170, 255, 0.12) 1px, transparent 1.4px);
      background-size: 22px 22px;
      color: #e9eefb;
      font: 13px 'Sora', system-ui, sans-serif;
      padding: 16px;
    }
    h1 { font-size: 14px; margin: 0 0 4px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    h1 .dot {
      width: 12px;
      height: 12px;
      border-radius: 4px;
      background: #45d6ff;
      flex: none;
      box-shadow: 0 0 12px rgba(69, 214, 255, 0.6);
    }
    p { color: #7d8aab; font-size: 12px; margin: 0 0 12px; }
    input {
      width: 100%;
      box-sizing: border-box;
      background: rgba(8, 12, 22, 0.8);
      border: 1px solid rgba(148, 178, 255, 0.18);
      border-radius: 9px;
      color: #e9eefb;
      padding: 9px 10px;
      font: 12px 'Geist Mono', ui-monospace, Menlo, Consolas, monospace;
    }
    input:focus { outline: none; border-color: #45d6ff; box-shadow: 0 0 0 3px rgba(69, 214, 255, 0.15); }
    button {
      margin-top: 8px;
      width: 100%;
      background: linear-gradient(180deg, #7ae2ff, #35c4f5);
      color: #041018;
      border: 0;
      border-radius: 9px;
      padding: 10px;
      font: 700 13px 'Sora', system-ui, sans-serif;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 8px 24px rgba(69, 214, 255, 0.25);
    }
    button.secondary {
      background: rgba(23, 31, 52, 0.6);
      color: #a8b4cf;
      border: 1px solid rgba(148, 178, 255, 0.22);
      font-weight: 600;
      margin-top: 0;
      box-shadow: none;
    }
    button:hover:not(:disabled) { filter: brightness(1.08); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    #msg { color: #7d8aab; font-size: 11.5px; margin-top: 10px; min-height: 14px; }
    .hr { height: 1px; background: rgba(148, 178, 255, 0.12); margin: 12px 0; }
  </style>
</head>
<body>
  <h1><span class="dot"></span>GDrive Down</h1>
  <p>Capture a view-only Drive file to PDF. Runs locally in your browser.</p>
  <button id="tabBtn" class="secondary">Capture the current Drive tab</button>
  <div class="hr"></div>
  <input id="link" placeholder="or paste a Drive link…" />
  <button id="goBtn">Capture link</button>
  <div id="msg"></div>
  <script src="popup.js"></script>
</body>
</html>
