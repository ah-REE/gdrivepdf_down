<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { margin: 0; width: 300px; background: #0b0f16; color: #eaf0f8; font: 13px system-ui, sans-serif; padding: 16px; }
    h1 { font-size: 14px; margin: 0 0 4px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    h1 .dot { width: 12px; height: 12px; border-radius: 4px; background: #3ed5a3; flex: none; }
    p { color: #8b95a7; font-size: 12px; margin: 0 0 12px; }
    input { width: 100%; box-sizing: border-box; background: #151b26; border: 1px solid rgba(255,255,255,.12); border-radius: 8px; color: #eaf0f8; padding: 9px 10px; font: 12px ui-monospace, Menlo, Consolas, monospace; }
    button { margin-top: 8px; width: 100%; background: #3ed5a3; color: #04140d; border: 0; border-radius: 8px; padding: 10px; font: 600 13px system-ui, sans-serif; cursor: pointer; }
    button.secondary { background: transparent; color: #cfd6e2; border: 1px solid rgba(255,255,255,.16); font-weight: 500; margin-top: 0; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    #msg { color: #8b95a7; font-size: 11.5px; margin-top: 10px; min-height: 14px; }
    .hr { height: 1px; background: rgba(255,255,255,.08); margin: 12px 0; }
  </style>
</head>
<body>
  <h1><span class="dot"></span>GDrive Down</h1>
  <p>Capture a view-only Drive file to PDF. Runs locally in your browser.</p>
  <button id="tabBtn" class="secondary">Capture the current Drive tab</button>
  <div class="hr"></div>
  <input id="link" placeholder="or paste a Drive link…" />
  <button id="goBtn">Capture link</button>
  <div id="msg"></div>
  <script src="popup.js"></script>
</body>
</html>
